name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  make:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and test (Makefile)
        run: make test

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test with ASan/UBSan
        run: CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" make test

  cmake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-cmake
      - name: Test
        run: ctest --test-dir build-cmake --output-on-failure
